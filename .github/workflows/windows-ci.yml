name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test tests/OpsisAppearance.Tests -c Release
      - name: Settings page renders (dark/light, en/el)
        shell: pwsh
        run: |
          dotnet build src/OpsisAppearance.App -c Release
          $exe = Get-ChildItem src/OpsisAppearance.App/bin/Release -Recurse -Filter OpsisAppearance.exe | Select-Object -First 1
          foreach ($m in '', '--light') { foreach ($l in '', '--el') { & $exe.FullName --snapshot "$env:RUNNER_TEMP/s.png" $m $l; if (-not (Test-Path "$env:RUNNER_TEMP/s.png")) { throw "snapshot failed ($m $l)" } Remove-Item "$env:RUNNER_TEMP/s.png" } }
