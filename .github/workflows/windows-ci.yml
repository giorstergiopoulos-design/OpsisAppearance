name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test tests/OpsisAppearance.Tests -c Release
      - name: Settings page renders (dark/light, en/el)
        shell: pwsh
        run: |
          dotnet build src/OpsisAppearance.App -c Release
          $exe = Get-ChildItem src/OpsisAppearance.App/bin/Release -Recurse -Filter OpsisAppearance.exe | Select-Object -First 1
          $png = Join-Path $env:RUNNER_TEMP 's.png'
          # a WinForms exe is a GUI-subsystem program: PowerShell's & does not wait for it, so Start-Process -Wait is required
          foreach ($m in @(@(), @('--light'))) { foreach ($l in @(@(), @('--el'))) {
            if (Test-Path $png) { Remove-Item $png }
            $a = @('--snapshot', $png) + $m + $l
            $p = Start-Process -FilePath $exe.FullName -ArgumentList $a -Wait -PassThru
            if ($p.ExitCode -ne 0 -or -not (Test-Path $png) -or (Get-Item $png).Length -lt 10000) { throw "snapshot failed (exit $($p.ExitCode)): $a" }
          } }
